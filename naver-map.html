      top: 10px;

      cursor: pointer;

      color: #fff;
      font-weight: bold;
      font-size: 14px;
      cursor: pointer;
      line-height: 1;
    }

    .priority-btn:hover,
    .priority-btn:focus {
      outline: 2px solid #333;
      outline-offset: 2px;
    }

    .priority-btn.is-active {
      border-color: #222;
      box-shadow: 0 0 0 2px #fff, 0 0 0 4px #222;
    }

    .priority-clear {
      margin-top: 8px;
      padding: 4px 10px;
      font-size: 12px;
      border: 1px solid #ccc;
      border-radius: 4px;
      background: #f5f5f5;
      cursor: pointer;
    }

    .priority-clear:hover,
    .priority-clear:focus {
      background: #e8e8e8;
    }

      top: 12px;
      right: 12px;
      z-index: 100;
      background: #fff;
      border-radius: 8px;

  const PRIORITY_STORAGE_KEY = "cheonwon-apartment-priorities-v2";

  const PRIORITY_COLORS = {
    1: "#c62828",
    2: "#ef6c00",
    3: "#f9a825",
    4: "#1565c0",
    5: "#6a1b9a",
    default: "#757575"
  };

  const getAptId = (apt) => apt.address;

  const aptPanel = document.getElementById("apt-panel");
  const aptPanelBody = document.getElementById("apt-panel-body");
  const saveToast = document.getElementById("save-toast");
  let currentAptId = null;
  let saveToastTimer = null;

  const loadPriorities = () => {
    const sources = [
      PRIORITY_STORAGE_KEY,
      "cheonwon-apartment-priorities"
    ];
    const merged = {};

    for (const key of sources) {
      try {
        const raw = localStorage.getItem(key) || sessionStorage.getItem(key);
        if (!raw) continue;
        Object.assign(merged, JSON.parse(raw));
      } catch {
        /* ignore */
      }
    }

    const migrated = {};

    apartments.forEach((apt, index) => {
      const aptId = getAptId(apt);
      const legacyNameKey = `${apt.name}|${apt.address}`;
      const indexKey = String(index);

      if (merged[aptId] != null) {
        migrated[aptId] = Number(merged[aptId]);
      } else if (merged[legacyNameKey] != null) {
        migrated[aptId] = Number(merged[legacyNameKey]);
      } else if (merged[indexKey] != null) {
        migrated[aptId] = Number(merged[indexKey]);
      } else if (merged[index] != null) {
        migrated[aptId] = Number(merged[index]);
      }
    });

    return migrated;
  };

  const savePriorities = (priorities) => {
    const json = JSON.stringify(priorities);

    try {
      localStorage.setItem(PRIORITY_STORAGE_KEY, json);
      sessionStorage.setItem(PRIORITY_STORAGE_KEY, json);
      return true;
    } catch (err) {
      console.warn("우선순위 저장 실패:", err);
      try {
        sessionStorage.setItem(PRIORITY_STORAGE_KEY, json);
        return true;
      } catch {
        return false;
      }
    }
  };

  let priorities = loadPriorities();

  const showSaveToast = (message, isError = false) => {
    saveToast.textContent = message;
    saveToast.classList.toggle("is-error", isError);

    if (saveToastTimer) clearTimeout(saveToastTimer);
    saveToastTimer = setTimeout(() => {
      saveToast.textContent = "";
      saveToast.classList.remove("is-error");
    }, 2000);
  };

    const hasPriority = priority >= 1 && priority <= 5;
    const bg = hasPriority ? PRIORITY_COLORS[priority] : PRIORITY_COLORS.default;
    const label = hasPriority ? String(priority) : "·";
    const size = hasPriority ? 34 : 28;
    const fontSize = hasPriority ? 16 : 14;

    return {
      content: `
        <div style="
          width:${size}px;
          height:${size}px;
          background:${bg};
          border:2px solid #fff;
          border-radius:50%;
          color:#fff;
          font-weight:bold;
          font-size:${fontSize}px;
          line-height:${size - 4}px;
          text-align:center;
          box-shadow:0 2px 6px rgba(0,0,0,0.35);
          cursor:pointer;
          font-family:sans-serif;
        ">${label}</div>
      `,
      anchor: new naver.maps.Point(size / 2, size / 2)
    };
  };

          class="info-window-close"
          aria-label="팝업 닫기"
          onclick="CheonwonMap.closeInfoWindow(); return false;"
        >×</button>

        <div>${apt.address}</div>
        <div>준공년도: ${apt.year}</div>
        <div style="margin-top:8px;font-size:12px;color:#555;">
          ${priorityText}<br>
          ← 왼쪽 패널에서 변경
        </div>
      </div>
    `;
  };

  const closeAptPanel = () => {
    aptPanel.classList.remove("is-open");
    currentAptId = null;
  };

  const closeActiveInfoWindow = () => {
    if (activeInfoEntry?.infoWindow?.getMap()) {
      activeInfoEntry.infoWindow.close();
    }
    activeInfoEntry = null;
  };

  const closeAllOverlays = () => {
    closeActiveInfoWindow();
    closeAptPanel();
  };

  const isOverlayOpen = () =>
    aptPanel.classList.contains("is-open") ||
    !!activeInfoEntry?.infoWindow?.getMap();

  const isClickInsideInfoWindow = (domEvent) => {
    if (!domEvent || !activeInfoEntry) return false;

    const contentEl =
      typeof activeInfoEntry.infoWindow.getContentElement === "function"
        ? activeInfoEntry.infoWindow.getContentElement()
        : null;

    if (!contentEl) return false;
    return contentEl.contains(domEvent.target);
  };

  window.CheonwonMap = {
    closeInfoWindow: closeAllOverlays
  };

  const renderAptPanel = (apt, aptId) => {
    const currentPriority = priorities[aptId] ?? null;

    const priorityButtons = [1, 2, 3, 4, 5]
      .map((n) => {
        const isActive = currentPriority === n ? " is-active" : "";
        return `
          <button
            type="button"
            class="priority-btn${isActive}"
            data-priority="${n}"
            data-apt-id="${encodeURIComponent(aptId)}"
            style="background:${PRIORITY_COLORS[n]}"
            aria-label="우선순위 ${n}"
            aria-pressed="${currentPriority === n}"
          >${n}</button>
        `;
      })
      .join("");

    const priorityText = currentPriority
      ? `현재: <strong>${currentPriority}순위</strong>`
      : "현재: 미지정";

    aptPanelBody.innerHTML = `
      <div class="title">${apt.name}</div>
      <div style="margin:6px 0;">${apt.address}</div>
      <div>준공년도: ${apt.year}</div>
      <div class="priority-section">
        <div class="priority-label">방문 우선순위</div>
        <div class="priority-status">${priorityText}</div>
        <div class="priority-buttons" role="group" aria-label="우선순위 선택">
          ${priorityButtons}
        </div>
        <button type="button" class="priority-clear" data-apt-id="${encodeURIComponent(aptId)}">
          우선순위 해제
        </button>
      </div>
    `;

    aptPanel.classList.add("is-open");
  };

  const openAptPanel = (apt, aptId) => {
    currentAptId = aptId;
    renderAptPanel(apt, aptId);
  };

  const markerRegistry = {};

  const applyPriorityToMarker = (aptId, priority) => {
    const entry = markerRegistry[aptId];
    if (!entry) return;

    const wasOpen = !!entry.infoWindow.getMap();

    entry.marker.setIcon(getMarkerIcon(priority));
    entry.infoWindow.setContent(
      buildInfoWindowContent(entry.apt, priority)
    );

    if (wasOpen) {
      entry.infoWindow.open(entry.map, entry.marker);
    }
  };

  const setPriority = (aptId, priority) => {
    if (!aptId) return;

    if (priority === null || priority === undefined || Number.isNaN(priority)) {
      delete priorities[aptId];
    } else {
      priorities[aptId] = priority;
    }

    const saved = savePriorities(priorities);
    applyPriorityToMarker(aptId, priorities[aptId] ?? null);

    if (currentAptId === aptId) {
      const entry = markerRegistry[aptId];
      if (entry) renderAptPanel(entry.apt, aptId);
    }

    if (saved) {
      showSaveToast(
        priority ? `${priority}순위로 저장됨` : "우선순위 해제됨"
      );
    } else {
      showSaveToast("저장 공간을 사용할 수 없습니다.", true);
    }
  };

  const map = new naver.maps.Map("map", {
    center: new naver.maps.LatLng(37.537, 126.737),
    zoom: 13
  });

  document.addEventListener("click", (e) => {
    if (suppressOutsideClose) {
      suppressOutsideClose = false;
      return;
    }

    if (!isOverlayOpen()) return;
    if (e.target.closest("#apt-panel")) return;

    if (e.target.closest(".info-window-close")) {
      closeAllOverlays();
      return;
    }

    if (isClickInsideInfoWindow(e)) return;

    closeAllOverlays();
  });

  aptPanel.addEventListener("click", (e) => {
    const priorityBtn = e.target.closest(".priority-btn");
    if (priorityBtn) {
      const aptId = decodeURIComponent(priorityBtn.dataset.aptId);
      setPriority(aptId, Number(priorityBtn.dataset.priority));
      return;
    }

    const clearBtn = e.target.closest(".priority-clear");
    if (clearBtn) {
      setPriority(decodeURIComponent(clearBtn.dataset.aptId), null);
      return;
    }

    if (e.target.closest(".panel-close")) {
      closeAllOverlays();
    }
  });

  apartments.forEach((apt) => {
    const aptId = getAptId(apt);

    naver.maps.Service.geocode(
      { query: apt.address },
      function (status, response) {
        if (status !== naver.maps.Service.Status.OK) {
          return;
        }

        const result = response.v2.addresses[0];
        const position = new naver.maps.LatLng(result.y, result.x);
        const savedPriority = priorities[aptId] ?? null;

        const marker = new naver.maps.Marker({
          map: map,
          position: position,
          title: apt.name,
          icon: getMarkerIcon(savedPriority)
        });

        const infoWindow = new naver.maps.InfoWindow({
          content: buildInfoWindowContent(apt, savedPriority)
        });

        markerRegistry[aptId] = {
          marker,
          infoWindow,
          apt,
          map
        };

        naver.maps.Event.addListener(marker, "click", function () {
          suppressOutsideClose = true;
          closeActiveInfoWindow();
          openAptPanel(apt, aptId);
          infoWindow.open(map, marker);
          activeInfoEntry = markerRegistry[aptId];
        });
      }
    );
  });
</script>

</body>
</html>
